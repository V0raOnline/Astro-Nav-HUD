# Jyotish - 12 Rashis (signos sidéreos)
# Fuentes: Brihat Parashara Hora Shastra, Brihat Jataka (Varahamihira)
# Nota: aunque comparten nombre con el zodíaco occidental, los rashis
# operan en el zodíaco sidéreo y tienen caracterizaciones propias
# dentro de la tradición jyotish clásica

Mesha:
  es: Aries sidéreo
  regente: Marte
  keywords: "Dharma del guerrero · Acción directa · Iniciativa"
  description: "Primer rashi, regido por Marte. Energía que actúa antes de deliberar. Capacidad de abrir camino donde no lo hay — valentía como modo de ser."

Vrishabha:
  es: Tauro sidéreo
  regente: Venus
  keywords: "Estabilidad · Belleza material · Acumulación paciente"
  description: "Rashi de Venus. Construye con calma, valora la permanencia. Encuentra lo sagrado en lo sensorial y lo concreto."

Mithuna:
  es: Géminis sidéreo
  regente: Mercurio
  keywords: "Intelecto · Dualidad · Comunicación"
  description: "Rashi de Mercurio. Mente que recoge información de múltiples fuentes y las conecta con agilidad. La palabra como herramienta principal."

Kataka:
  es: Cáncer sidéreo
  regente: Luna
  keywords: "Nutrición · Memoria profunda · Protección"
  description: "Rashi lunar. Profundamente receptivo, retiene todo lo que toca. La protección del hogar y el linaje como vocación."

Simha:
  es: Leo sidéreo
  regente: Sol
  keywords: "Autoridad solar · Dignidad · Expresión plena"
  description: "Rashi solar. La autoridad aquí es natural, no conquistada. Necesita expresarse con plenitud — la contención no es su modo."

Kanya:
  es: Virgo sidéreo
  regente: Mercurio
  keywords: "Discernimiento · Pureza · Servicio preciso"
  description: "El Mercurio analítico. Distingue con precisión, sirve con meticulosidad. Busca la perfección funcional, no la ornamental."

Tula:
  es: Libra sidéreo
  regente: Venus
  keywords: "Dharma social · Justicia · Equilibrio activo"
  description: "Exaltación de Saturno. Busca la justicia como principio ordenador. El equilibrio no como neutralidad sino como trabajo constante."

Vrischika:
  es: Escorpio sidéreo
  regente: Marte
  keywords: "Transformación radical · Profundidad · Ocultismo"
  description: "Marte en su forma profunda y oculta. Transforma radicalmente lo que toca. Opera bajo la superficie con una intensidad que no necesita mostrarse."

Dhanus:
  es: Sagitario sidéreo
  regente: Júpiter
  keywords: "Sabiduría · Dharma · Expansión del conocimiento"
  description: "Rashi de Júpiter. Busca la verdad más allá de lo inmediato. Filosofía, ley y comprensión universal como territorio natural."

Makara:
  es: Capricornio sidéreo
  regente: Saturno
  keywords: "Disciplina kármica · Estructura · Legado duradero"
  description: "Exaltación de Marte. Saturno construye aquí con la mayor paciencia. Lo que se logra en Makara está construido para atravesar generaciones."

Kumbha:
  es: Acuario sidéreo
  regente: Saturno
  keywords: "Servicio colectivo · Desapego · Ruptura necesaria"
  description: "Saturno en su dimensión social. Sirve al conjunto con desapego. Rompe las estructuras que ya no funcionan — no por destruir sino por necesidad."

Mina:
  es: Piscis sidéreo
  regente: Júpiter
  keywords: "Moksha · Disolución · Compasión sin límites"
  description: "Exaltación de Venus. Júpiter en su forma más expansiva. La disolución del ego hacia algo mayor — no pérdida sino apertura."
